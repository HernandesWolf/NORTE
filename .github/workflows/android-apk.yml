name: APK Android (piloto)

# Gera o APK do NORTE e publica em "Releases", com link de download direto (sem login no GitHub).
# Como usar: aba Actions > "APK Android (piloto)" > Run workflow.
# A URL da API vem do campo abaixo ou da variável de repositório NORTE_API_URL.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL da API em produção (https://...). Se vazio, usa a variável NORTE_API_URL."
        required: false
        type: string

permissions:
  contents: write

jobs:
  apk:
    name: Build do APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      API_URL: ${{ inputs.api_url || vars.NORTE_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar a URL da API
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Informe a URL da API no campo do workflow ou crie a variável de repositório NORTE_API_URL."
            exit 1
          fi
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::A URL da API precisa começar com https://"; exit 1 ;;
          esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # O projeto foi criado só com Web; geramos a pasta android no build.
      # Depois restauramos qualquer arquivo versionado que o "flutter create" possa ter tocado.
      - name: Gerar plataforma Android
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org br.com.norte --project-name norte_app .
            git checkout -- lib test pubspec.yaml
          fi

      - name: Permissão de internet e nome do app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$MANIFEST"
          fi
          sed -i 's/android:label="[^"]*"/android:label="NORTE"/' "$MANIFEST"
          grep -n -E "INTERNET|android:label" "$MANIFEST"

      # Opcional: com uma chave fixa, o APK novo instala por cima do antigo sem desinstalar.
      # Segredo de repositório DEBUG_KEYSTORE_BASE64 = arquivo debug.keystore em base64.
      - name: Chave de assinatura fixa (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Chave fixa aplicada."
          else
            echo "::warning::Sem DEBUG_KEYSTORE_BASE64: cada APK sai com uma chave nova e, para atualizar, será preciso desinstalar o app antes."
          fi

      - run: flutter pub get

      - name: Compilar o APK
        run: flutter build apk --release --dart-define=NORTE_API_URL="$API_URL"

      - name: Nomear o arquivo
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/NORTE-piloto-${{ github.run_number }}.apk"

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: piloto-${{ github.run_number }}
          name: NORTE piloto ${{ github.run_number }}
          body: |
            APK de teste do NORTE para Android.
            Baixe o arquivo .apk abaixo, abra no celular e permita "instalar apps desconhecidos" quando o Android pedir.
          files: frontend/build/NORTE-piloto-${{ github.run_number }}.apk
          make_latest: true
