<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="t"><title id="t">Experiência NORTE — quatro momentos</title><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#fff9f5"/><stop offset="1" stop-color="#f0dadd"/></linearGradient></defs><rect width="1400" height="560" rx="30" fill="url(#g)"/><text x="700" y="75" text-anchor="middle" font-family="Georgia,serif" font-size="42" fill="#76505d">Um espaço para organizar o que importa</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(125 135)"><rect width="245" height="340" rx="28" fill="#fffdfb" stroke="#e4c7ca" stroke-width="3"/><rect x="18" y="20" width="209" height="130" rx="18" fill="#f4e4e4"/><circle cx="122" cy="78" r="33" fill="#c78f91"/><path d="M73 130q49-75 98 0" fill="#b87583"/><text x="122" y="205" font-size="25" fill="#76505d" font-weight="bold">Início</text><text x="122" y="245" font-size="17" fill="#8a6870">Como você</text><text x="122" y="270" font-size="17" fill="#8a6870">chega hoje?</text></g><g transform="translate(435 135)"><rect width="245" height="340" rx="28" fill="#fffdfb" stroke="#e4c7ca" stroke-width="3"/><rect x="18" y="20" width="209" height="130" rx="18" fill="#f7e9e5"/><path d="M65 62h115M65 86h90M65 110h105" stroke="#b87583" stroke-width="9" stroke-linecap="round"/><text x="122" y="205" font-size="25" fill="#76505d" font-weight="bold">Conversa</text><text x="122" y="245" font-size="17" fill="#8a6870">Um diálogo</text><text x="122" y="270" font-size="17" fill="#8a6870">sem julgamento</text></g><g transform="translate(745 135)"><rect width="245" height="340" rx="28" fill="#fffdfb" stroke="#e4c7ca" stroke-width="3"/><rect x="18" y="20" width="209" height="130" rx="18" fill="#f4e9e0"/><path d="M68 115l34-38 26 20 48-54" fill="none" stroke="#9a6b78" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="176" cy="43" r="8" fill="#9a6b78"/><text x="122" y="205" font-size="25" fill="#76505d" font-weight="bold">Objetivos</text><text x="122" y="245" font-size="17" fill="#8a6870">Pequenos passos,</text><text x="122" y="270" font-size="17" fill="#8a6870">no seu ritmo</text></g><g transform="translate(1055 135)"><rect width="245" height="340" rx="28" fill="#fffdfb" stroke="#e4c7ca" stroke-width="3"/><rect x="18" y="20" width="209" height="130" rx="18" fill="#eee4e1"/><circle cx="122" cy="65" r="27" fill="#c58e84"/><path d="M72 133q10-52 50-52t50 52" fill="#a66e7d"/><text x="122" y="205" font-size="25" fill="#76505d" font-weight="bold">Perfil</text><text x="122" y="245" font-size="17" fill="#8a6870">Sua história,</text><text x="122" y="270" font-size="17" fill="#8a6870">suas escolhas</text></g></g></svg>