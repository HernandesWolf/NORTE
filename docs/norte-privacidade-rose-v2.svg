<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="t"><title id="t">Privacidade e confiança</title><defs><linearGradient id="p" x2="1" y2="1"><stop stop-color="#f9efeb"/><stop offset="1" stop-color="#e8cdd0"/></linearGradient></defs><rect width="1400" height="360" rx="28" fill="url(#p)"/><g transform="translate(150 65)"><path d="M100 0l80 30v72q0 85-80 125Q20 187 20 102V30Z" fill="#a66e7d"/><path d="M100 55a32 32 0 0 0-32 32v23h64V87a32 32 0 0 0-32-32Z" fill="none" stroke="#fff8f5" stroke-width="9"/><rect x="57" y="105" width="86" height="65" rx="12" fill="#fff8f5"/><circle cx="100" cy="132" r="8" fill="#a66e7d"/><path d="M100 140v15" stroke="#a66e7d" stroke-width="6" stroke-linecap="round"/></g><g fill="#76505d"><text x="430" y="130" font-family="Georgia,serif" font-size="48">Confiança também é cuidado.</text><text x="432" y="190" font-family="Arial,sans-serif" font-size="24">Privacidade desde a concepção, finalidade clara e controle</text><text x="432" y="230" font-family="Arial,sans-serif" font-size="24">sobre os próprios dados — requisitos para merecer confiança.</text></g></svg>