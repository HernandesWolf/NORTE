  <path d="M0 390 Q260 330 470 395 T900 380 T1600 340 V520 H0Z" fill="#E7CDD0" opacity=".62"/>
  <path d="M0 440 Q270 365 520 430 T1000 410 T1600 365" fill="none" stroke="#C99AA3" stroke-width="2" opacity=".48"/>
  <path d="M880 520 C980 450 1030 425 1110 390 S1260 315 1320 265 S1410 190 1500 155" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round" opacity=".92"/>
  <path d="M880 520 C980 450 1030 425 1110 390 S1260 315 1320 265 S1410 190 1500 155" fill="none" stroke="#B87583" stroke-width="18" stroke-linecap="round" opacity=".18" filter="url(#blur)"/>
