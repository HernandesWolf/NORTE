  <rect x="365" y="232" width="550" height="5" rx="3" fill="url(#glow)"/>
  <text x="365" y="300" fill="#533944" font-family="DM Sans,Segoe UI,Arial,sans-serif" font-size="31" font-weight="600">Seu tempo. Sua história.</text>
  <text x="365" y="350" fill="#76505D" font-family="DM Sans,Segoe UI,Arial,sans-serif" font-size="31" font-weight="600">Seu caminho.</text>
  <text x="365" y="415" fill="#76505D" font-family="DM Sans,Segoe UI,Arial,sans-serif" font-size="20">Orientação pessoal com IA • objetivos possíveis • progresso no seu ritmo</text>
  <g transform="translate(1280 110)">
