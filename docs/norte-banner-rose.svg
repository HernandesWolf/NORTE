<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">NORTE — Seu tempo. Sua história. Seu caminho.</title>
  <desc id="desc">Banner NORTE Rose Edition com bússola delicada, horizonte suave e trilha em direção ao destino.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF7F3"/><stop offset=".56" stop-color="#F3DDDF"/><stop offset="1" stop-color="#E9DCD3"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B87583"/><stop offset=".55" stop-color="#A96D7B"/><stop offset="1" stop-color="#76505D"/></linearGradient>
    <radialGradient id="orb"><stop offset="0" stop-color="#D7AEB4" stop-opacity=".42"/><stop offset="1" stop-color="#D7AEB4" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1290" cy="120" r="260" fill="url(#orb)"/>
  <circle cx="1290" cy="120" r="150" fill="none" stroke="#B87583" stroke-opacity=".18" stroke-width="1"/>
