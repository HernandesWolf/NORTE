<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">NORTE — um lugar para recomeçar no seu ritmo</title>
<desc id="desc">Ilustração editorial acolhedora de uma pessoa em um momento de pausa perto de uma janela, com luz suave e plantas.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBF7F3"/><stop offset="1" stop-color="#EED9DC"/></linearGradient>
 <linearGradient id="window" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E7C4C8"/><stop offset="1" stop-color="#F9E9E4"/></linearGradient>
 <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C88D99"/><stop offset="1" stop-color="#8F5868"/></linearGradient>
</defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/>
<circle cx="920" cy="160" r="190" fill="#fff" opacity=".25"/>
<text x="78" y="142" font-family="Georgia,serif" font-size="43" fill="#684451">Você não precisa</text>
<text x="78" y="198" font-family="Georgia,serif" font-size="43" fill="#684451">ter todas as respostas</text>
<text x="78" y="254" font-family="Georgia,serif" font-size="43" fill="#A96778">para começar.</text>
<path d="M82 288 Q240 305 385 286" fill="none" stroke="#C58C97" stroke-width="3" stroke-linecap="round"/>
<text x="82" y="348" font-family="Arial,sans-serif" font-size="20" fill="#76505D">Às vezes, o primeiro passo é apenas</text>
<text x="82" y="379" font-family="Arial,sans-serif" font-size="20" fill="#76505D">encontrar um pouco de clareza.</text>
<text x="82" y="454" font-family="Arial,sans-serif" font-size="14" letter-spacing="2" fill="#9A737D">NORTE · SEU TEMPO. SUA HISTÓRIA. SEU CAMINHO.</text>
