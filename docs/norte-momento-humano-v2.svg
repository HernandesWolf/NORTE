<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="t"><title id="t">Uma pausa para se ouvir</title><defs><linearGradient id="a" x2="1" y2="1"><stop stop-color="#fff9f5"/><stop offset="1" stop-color="#f0d9dc"/></linearGradient></defs><rect width="1400" height="500" rx="30" fill="url(#a)"/><circle cx="1080" cy="245" r="170" fill="#e7c5c5" opacity=".45"/><circle cx="1080" cy="245" r="115" fill="#fff5e9" opacity=".8"/><g transform="translate(880 100)"><path d="M140 140 Q70 165 52 310 L28 365 Q155 405 285 365 L260 240 Q245 165 190 140Z" fill="#a66e7d"/><circle cx="166" cy="100" r="52" fill="#c58e84"/><path d="M114 98 Q105 20 174 22 Q235 32 216 127 Q195 80 164 83 Q139 117 114 98Z" fill="#4d3b40"/><path d="M120 160q-60 42-52 115" fill="none" stroke="#f7e3df" stroke-width="9" opacity=".7"/></g><g fill="#76505d"><text x="100" y="155" font-family="Georgia,serif" font-size="54">Antes de seguir,</text><text x="100" y="220" font-family="Georgia,serif" font-size="54">respire.</text><text x="104" y="290" font-family="Arial,sans-serif" font-size="25">Nem todo caminho começa com uma resposta.</text><text x="104" y="330" font-family="Arial,sans-serif" font-size="25">Às vezes, começa quando alguém finalmente se escuta.</text></g><path d="M105 375h330" stroke="#b87583" stroke-width="4" stroke-linecap="round"/></svg>