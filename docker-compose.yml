services:
  postgres:
    image: postgres:16
    container_name: norte-postgres
    environment:
      POSTGRES_DB: norte
      POSTGRES_USER: norte
      POSTGRES_PASSWORD: norte_dev   # apenas desenvolvimento local
    ports:
      - "5433:5432"
    volumes:
      - norte-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norte -d norte"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  norte-pgdata:
