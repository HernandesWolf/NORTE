spring:
  application:
    name: norte-backend
  datasource:
    url: ${NORTE_DB_URL:jdbc:postgresql://localhost:5433/norte}
    username: ${NORTE_DB_USER:norte}
    password: ${NORTE_DB_PASSWORD:norte_dev}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é controlado exclusivamente pelo Flyway.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

norte:
  version: 0.1.0-SNAPSHOT
  security:
    jwt:
      # Valor apenas para desenvolvimento local. Em produção, defina NORTE_JWT_SECRET (>= 32 bytes);
      # com o perfil "prod" ativo, a aplicação se recusa a iniciar com o valor de desenvolvimento.
      secret: ${NORTE_JWT_SECRET:dev-only-troque-em-producao-0123456789abcdef}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
  cors:
    # Origens permitidas para o app rodando no navegador (Flutter Web usa uma porta aleatória em dev).
    # Em produção, defina NORTE_CORS_ORIGINS com o domínio real, ex.: https://app.exemplo.com.br
    allowed-origin-patterns: ${NORTE_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  # Fuso que define "hoje" para o check-in diário (padrão: horário de Brasília).
  fuso-horario: ${NORTE_FUSO_HORARIO:America/Sao_Paulo}
  ia:
    # Conversa com IA. Padrão "desligado": a API sobe normalmente e a conversa avisa que não está ativada.
    # Opções: desligado | groq | gemini. A chave NUNCA vai no código: só por variável de ambiente.
    provedor: ${NORTE_IA_PROVEDOR:desligado}
    chave: ${NORTE_IA_CHAVE:}
    # Groq já tem modelo padrão. No Gemini é obrigatório (copie o nome do modelo no Google AI Studio).
    modelo: ${NORTE_IA_MODELO:}
    # Mensagens por pessoa. A cota gratuita do provedor é da organização inteira: mantenha valores baixos.
    limite-por-minuto: ${NORTE_IA_LIMITE_MINUTO:5}
    limite-por-dia: ${NORTE_IA_LIMITE_DIA:30}
