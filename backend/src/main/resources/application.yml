spring:
  application:
    name: norte-backend
  datasource:
    url: ${NORTE_DB_URL:jdbc:postgresql://localhost:5433/norte}
    username: ${NORTE_DB_USER:norte}
    password: ${NORTE_DB_PASSWORD:norte_dev}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é controlado exclusivamente pelo Flyway.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

norte:
  version: 0.1.0-SNAPSHOT
  security:
    jwt:
      # Valor apenas para desenvolvimento local. Em produção, defina NORTE_JWT_SECRET (>= 32 bytes);
      # com o perfil "prod" ativo, a aplicação se recusa a iniciar com o valor de desenvolvimento.
      secret: ${NORTE_JWT_SECRET:dev-only-troque-em-producao-0123456789abcdef}
      access-token-ttl: 15m
